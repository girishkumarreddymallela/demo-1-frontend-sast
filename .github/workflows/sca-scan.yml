name: Security SCA (Dependency Scan)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sca_dependency_scan:
    name: Trivy & NPM Audit SCA Scanner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Run NPM Audit SCA Check
      # --audit-level=high fails build if High or Critical CVEs are found in dependencies
      - name: Run NPM Audit SCA Security Check
        run: |
          npm audit --audit-level=high

      # Step 4: Run Aqua Security Trivy SCA Vulnerability Scanner
      - name: Run Trivy Open-Source SCA Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
