name: Security SAST & Secrets Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sast_scan:
    name: Semgrep SAST & Secret Scanner
    runs-on: ubuntu-latest

    # Run inside the official Semgrep Docker container
    container:
      image: semgrep/semgrep

    steps:
      # Step 1: Checkout repo source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Run Semgrep SAST Scan
      # --error: Fails the build if findings are detected (Quality Gate)
      # --sarif --output: Exports standardized SARIF report
      - name: Run Semgrep SAST Analysis
        run: |
          semgrep scan --config p/javascript --config p/secrets --error --sarif --output=semgrep.sarif src/

      # Step 3: Upload SARIF Report as downloadable artifact
      - name: Upload SAST Security Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-report
          path: semgrep.sarif
