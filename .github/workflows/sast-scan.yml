name: Security SAST & Secrets Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sast_scan:
    name: Semgrep SAST & Secret Scanner
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      # Step 1: Checkout repo source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Run Semgrep SAST Scan with Custom AppSec Rules & OWASP Top 10
      - name: Run Semgrep SAST Analysis
        run: |
          semgrep scan --config .semgrep/frontend-rules.yml --config p/owasp-top-10 --error --sarif --output=semgrep.sarif src/

      # Step 3: Upload SARIF Report as downloadable artifact
      - name: Upload SAST Security Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-report
          path: semgrep.sarif
